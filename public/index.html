<body>
  <a href="#main" class="skip-to-content">Skip to main content</a>

  <header aria-label="top navigation bar">
    <div class="container">
      <nav class="nav-bar" aria-label="Main navigation">
        <span class="logo"><a class="home-link" href="index.html">VG</a></span>
        <button id="hamburger" class="hamburger" aria-label="Toggle navigation menu" aria-controls="nav-menu">
          <span class="bar"></span>

          <span class="bar"></span>

        <ul class="nav-menu" id="nav-menu" aria-hidden="true">
          <li class="nav-item">
            <a href="./index.html" class="nav-link">Home</a>

          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="container">
      <h1>
        Visualize your goals &
        <span class="highlight">bring them to life</span>
      </h1>
      <h2 class="sub-title">Search. Save. Stay motivated.</h2>
      <form id="search-form" class="search-form" aria-label="Find images supporting your project">
        <input type="search" spellcheck="true" autocomplete="off" name="search" id="search" aria-label="Search"
          placeholder="Enter your search phrase . . ." />
        <p class="error-message" aria-live="polite"></p>
      </form>

      <section class="search-history">
        <div id="search-terms" class="search-terms"></div>
        <button id="clear-searches" class="clear-searches" hidden></button>
      </section>

      <section class="search-current">
        <h2 id="results-title" class="results-title" hidden></h2>
        <div id="search-grid" class="search-grid"></div>
        <button id="load-more" class="load-more" hidden></button>
      </section>

    </div>
  </main>

  <footer>
    <div class="container">
      <h2 class="footer-heading">
        Every goal starts with a vision. Create yours today.
      </h2>
      <div class="footer-flex">
        <p class="copyright">&copy; <span id="year"></span> James Kernicky</p>
        <a title="Github repo" target="_blank" href="https://github.com/Kernix13/vision-grid-express">

          </svg>
        </a>
      </div>
    </div>

    <button id="back-to-top-btn" aria-label="Back to top">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-up"
        viewBox="0 0 16 16" fill="currentColor">
        <path fill-rule="evenodd"
          d="M7.646 4.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 5.707l-5.646 5.647a.5.5 0 0 1-.708-.708z" />
      </svg>
    </button>
  </footer>

  <div class="modal-container" id="modal-bg" hidden>
    <button class="close-btn" id="close" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-x"
