<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Tags -->
  <title>VisualGrid | My Vision Board</title>
  <link rel="canonical" href="https://yourdomain.com/board" />
  <meta name="description"
    content="Organize your saved images, add notes, and visualize your goals and projects on your personal VisualGrid board." />

  <!-- Open Graph -->

    content="Organize your saved images, add notes, and visualize your goals and projects on your personal VisualGrid board." />
  <meta property="og:url" content="https://yourdomain.com/board" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="VisualGrid | My Vision Board" />
  <meta name="twitter:description"
    content="Organize your saved images, add notes, and visualize your goals and projects on your personal VisualGrid board." />
  <!-- <meta name="twitter:image" content="https://yourdomain.com/twitter-image-board.jpg"> -->

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="shortcut icon" href="images/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="images/android-chrome-512x512.png">

  <!-- Google Fonts -->
  <link rel="prefetch" href="./fonts/DMSans-400-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="prefetch" href="./fonts/DMSans-400-regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="prefetch" href="./fonts/DMSans-500-regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="prefetch" href="./fonts/DMSans-600-regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="prefetch" href="./fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="prefetch" href="./fonts/Inter-Italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="prefetch" href="./fonts/Allura.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="stylesheet" href="./css/global.css" />
  <link rel="stylesheet" href="./css/board.css" />
  <link rel="stylesheet" href="./css/modal.css" />
</head>

<body>
  <a href="#main" class="skip-to-content">Skip to main content</a>

  <header aria-label="top navigation bar">
    <div class="board-container">
      <nav class="nav-bar" aria-label="Main navigation">
        <span class="logo"><a class="home-link" href="index.html">VG</a></span>
        <button id="hamburger" class="hamburger" aria-label="Toggle navigation menu" aria-expanded="false"
          aria-controls="nav-menu">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
        <ul class="nav-menu" id="nav-menu" aria-hidden="true">
          <li class="nav-item">
            <a href="./index.html" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a href="./board.html" class="nav-link">Your Board</a>
          </li>
          <li class="nav-item">
            <a href="./about.html" class="nav-link">About</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <form id="settings-form" class="settings-form offscreen" aria-hidden="true" inert>
    <h3 class="settings-form-title">Project boards settings</h3>

    <div id="board-list" class="board-list">
      <div class="form-control">
        <label for="board-title">Edit your board name</label>
        <input id="board-title" class="board-title" type="text">
      </div>

      <fieldset>
        <legend>Lightbox timing (seconds)</legend>

        <div id="slider-time" class="slider-time">

          <div class="radio-option">
            <input type="radio" name="lightbox-speed" id="speed-6" value="6" checked>
            <label for="speed-6">6</label>
          </div>

          <div class="radio-option">
            <input type="radio" name="lightbox-speed" id="speed-8" value="8">
            <label for="speed-8">8</label>
          </div>

          <div class="radio-option">
            <input type="radio" name="lightbox-speed" id="speed-10" value="10">
            <label for="speed-10">10</label>
          </div>

          <div class="radio-option">
            <input type="radio" name="lightbox-speed" id="speed-15" value="15">
            <label for="speed-15">15</label>
          </div>

          <div class="radio-option">
            <input type="radio" name="lightbox-speed" id="speed-20" value="20">
            <label for="speed-20">20</label>
          </div>

        </div>
      </fieldset>

      <button type="button" id="play-slider" class="play-slider">Start Slider</button>
    </div>
  </form>

  <button id="settings-btn" class="settings-btn">Show Settings</button>

  <main id="main">
    <div class="board-container">
      <h1 class="board-page-title"></h1>

      <button id="thumbnails-btn" class="thumbnails-btn">
        Show thumbnails
      </button>
      <div class="thumbnails offscreen" aria-hidden="true" inert></div>

      <!-- image on left, editable div on right -->
      <div id="img-text-container" class="img-text-container"></div>

    </div>
  </main>

  <footer>
    <div class="container">
      <h2 class="footer-heading">
        Every goal starts with a vision. Create yours today.
      </h2>
      <div class="footer-flex">
        <p class="copyright">&copy; <span id="year"></span> James Kernicky</p>
        <a title="Github repo" target="_blank" href="https://github.com/Kernix13/vision-grid-express">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-github"
            viewBox="0 0 16 16">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8" />
          </svg>
        </a>
      </div>
    </div>

    <button id="back-to-top-btn" aria-label="Back to top">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="bi bi-chevron-up" viewBox="0 0 16 16"
        fill="currentColor">
        <path fill-rule="evenodd"
          d="M7.646 4.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 5.707l-5.646 5.647a.5.5 0 0 1-.708-.708z" />
      </svg>
    </button>
  </footer>

  <div class="thumb-modal-container" id="thumb-modal" hidden>
    <div class="thumb-modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
      <button class="close-btn" id="delete-close" aria-label="Close">
        <!-- <i class="fa fa-times"></i> -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-x"
          viewBox="0 0 16 16">
          <path
            d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708" />
        </svg>
      </button>
      <div class="modal-header">
        <h3 id="delete-modal-title">Remove Image</h3>
        <p>Are you sure you want to remove this image?</p>
      </div>
      <div class="modal-content">
        <button id="confirm-delete-btn" class="thumb-modal-btn">
          Delete
        </button>
        <button id="cancel-delete-btn" class="thumb-modal-btn">Cancel</button>
      </div>
    </div>
  </div>

  <div class="modal-container" id="modal-bg" hidden>
    <button class="close-btn" id="close-btn" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-x"
        viewBox="0 0 16 16">
        <path
          d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708" />
      </svg>
    </button>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Image Preview"></div>
  </div>

  <script src="./js/board.js" type="module"></script>
</body>

</html>
